<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.ico" />
    <title>Welcome</title>
    <style>
        body {
            background-color: black;
            color: #FFD454;
            font-family: monospace;
            overflow: hidden;
        }
        #date {
            /*position: absolute;
            top: 50%;
            left: 50%;
            */
            text-align: center;
        }
    </style>
</head>
<body>
<div id="date"></div>
<script>
    var dateArea = document.getElementById("date");
    
    dateArea.innerText = formatDate();
    function adjust() {
        dateArea.style.width = window.innerWidth + "px";
        dateArea.style.height = window.innerHeight + "px";
        dateArea.style.fontSize = (window.innerWidth / 3) + "px";
    }
    adjust();

    // Debounce function to prevent multiple rapid calls
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // Create a debounced version of adjust
    const debouncedAdjust = debounce(adjust, 100);

    // Handle both resize and orientation changes
    window.addEventListener("resize", debouncedAdjust);
    window.addEventListener("orientationchange", () => {
        // Force immediate adjustment on orientation change
        adjust();
        // Then debounce any subsequent adjustments
        debouncedAdjust();
    });

    //Update Time
    setInterval(function() {
        dateArea.innerText = formatDate();
    }, 1000);

    function formatDate() {
        var now = new Date();
        return hours(now) + ":" + minutes(now);
    }

    function minutes(now) {
        var m = now.getMinutes();

        if (m < 10) {
            m = "0" + m;
        }

        return m;
    }

    function hours(now) {
        var twentyFour = now.getHours()

        var twelve = ((twentyFour + 11) % 12 + 1);
        if (twelve < 10) {
            twelve = "0" + twelve;
        }

        return twelve;
    }

    // Register service worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/time/sw.js')
                .then(registration => {
                    console.log('ServiceWorker registration successful');
                })
                .catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
        });
    }
</script>
</body>
</html>
